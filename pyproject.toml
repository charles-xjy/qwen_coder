[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-coder"
version = "0.1.0"
description = "AI 编程助手：LangGraph + Qwen/Claude，mini_claude 的 LangGraph 重实现"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "rich>=13.0",
    "opensandbox",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
]

[project.scripts]
qwen-coder = "qwen_coder.__main__:main"

# 按功能分包（从源码运行：仓库根目录在 sys.path 上，子包以顶层名 core/graph/features/interfaces 导入）
#   core/       基础层：state、tools
#   graph/      Agent 运行时：agent、compressor、prompt、subagent
#   features/   子系统：memory、skills、sandbox、session
#   interfaces/ 接口层：ui、server
#   __main__.py CLI 入口（保留在根目录）
[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "graph*", "features*", "interfaces*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
