[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-coder"
version = "0.1.0"
description = "AI 编程助手：LangGraph + Qwen/Claude，mini_claude 的 LangGraph 重实现"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "rich>=13.0",
    "opensandbox",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
]

[project.scripts]
qwen-coder = "qwen_coder.__main__:main"

# 项目文件全部在 D:\mycode\qwen_coder\ 根目录下（flat layout）
# 告诉 setuptools：包名 qwen_coder 对应当前目录 "."
[tool.setuptools.package-dir]
"qwen_coder" = "."

[tool.setuptools.packages]
find = {where = [".."], include = ["qwen_coder"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
